    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <title>The Clarity Portal</title>
    <script>
      // Restore saved header height from localStorage before app renders
      // This prevents layout shift by setting --header-height immediately
      (function() {
        try {
          const savedHeight = localStorage.getItem('clarity-header-height');
          if (savedHeight) {
            document.documentElement.style.setProperty('--header-height', savedHeight);
          }
        } catch (e) {
          // localStorage blocked, use CSS fallback (56px)
        }
      })();
    </script>
  </head>
  <body style="background:#000000">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
