<!doctype html>
<html lang="en" style="background:#000000">
  <head>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <title>The Clarity Portal</title>
    <script>
      // When the browser blocks all site storage (Safari with "Block all
      // cookies", some private modes), reading it throws, and the app would
      // open on a blank screen. Then it gets an in-memory stand-in for this
      // visit: everything works, just without the device's copies and
      // drafts after the tab closes, and nothing alarming is said.
      (function () {
        function memory() {
          var data = {};
          return {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
            setItem: function (k, v) { data[k] = String(v); },
            removeItem: function (k) { delete data[k]; },
            clear: function () { data = {}; },
            key: function (i) { return Object.keys(data)[i] || null; },
            get length() { return Object.keys(data).length; },
          };
        }
        ['localStorage', 'sessionStorage'].forEach(function (name) {
          try {
            var s = window[name];
            s.setItem('clarity-storage-check', '1');
            s.removeItem('clarity-storage-check');
          } catch (e) {
            try { Object.defineProperty(window, name, { value: memory(), configurable: true }); } catch (e2) { /* nothing more to do */ }
          }
        });
      })();
    </script>
    <script>
      // Restore saved header height from localStorage before app renders
      // This prevents layout shift by setting --header-height immediately
      (function() {
        try {
          const savedHeight = localStorage.getItem('clarity-header-height');
          if (savedHeight) {
            document.documentElement.style.setProperty('--header-height', savedHeight);
          }
        } catch (e) {
          // localStorage blocked, use CSS fallback (56px)
        }
      })();
    </script>
  </head>
  <body style="background:#000000">
    <!-- The opening screen (Tim, 26 Oct): the turning crosshair until the
         app takes over (App.jsx draws the same one). Outside .ui-root, so
         its colours are written here; the design tokens are not loaded yet. -->
    <style>
      .opening{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
      .opening i{width:28px;height:28px;background:#FF6F5C;-webkit-mask:url(/brand/crosshair_white.png) center/contain no-repeat;mask:url(/brand/crosshair_white.png) center/contain no-repeat;animation:opening-spin 1.1s cubic-bezier(.45,.05,.55,.95) infinite}
      @keyframes opening-spin{to{transform:rotate(360deg)}}
      @keyframes opening-fade{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.opening i{animation:opening-fade 1.6s ease-in-out infinite}}
    </style>
    <div id="root"><div class="opening" role="status" aria-label="Loading"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
